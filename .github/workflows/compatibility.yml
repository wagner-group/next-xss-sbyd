name: compatibility
on:
  pull_request:
  push:
    branches: [main]
# Lockfiles and integrity hashes still control installs. Reuse cached tarballs
# before contacting the registry, including npm ci launched by test scripts.
env:
  npm_config_prefer_offline: 'true'
  npm_config_logs_dir: ${{ github.workspace }}/tmp/npm-logs

jobs:
  contracts:
    name: type, ESLint, and package contracts-node${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Test declared minimum patches as well as current patches.
        node: ['22.22.2', '24.15.0', '26.0.0', 22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --strict-peer-deps --engine-strict
      - name: Check TypeScript and ESLint parser compatibility
        run: npm run test:toolchain
      - name: Check exact React and React DOM compatibility
        run: npm run test:react
      - run: npm run typecheck
      - run: npm run test:runtime
      - run: npm run test:eslint
      - run: npm run test:types
      - run: npm run test:duplicate

  sanitizer-browsers:
    name: sanitizer and object URLs in Chromium, Firefox, and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit
      - run: npm run test:sanitize-browser
      - run: npm ci --prefix fixtures/next14
      - run: npm run test:object-url-browser
      - run: npm run test:frame-browser
      - run: npm run test:markdown-browser

  playwright-csp:
    name: Playwright CSP Chromium, Firefox, and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: node scripts/test-playwright-csp.mjs
      - run: node scripts/test-playwright-next.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-csp-diagnostics
          path: |
            tmp/playwright-csp/
            tmp/playwright-next/

  compatibility:
    name: compatibility-node${{ matrix.node }}-${{ matrix.fixture }}-${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        fixture: [next14, next15, next16]
        mode: [preload, instrumentation]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/${{ matrix.fixture }}/package-lock.json
      - run: npm ci
      - run: npm run test:compat -- ${{ matrix.fixture }} --mode=${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: npm-compatibility-node${{ matrix.node }}-${{ matrix.fixture }}-${{ matrix.mode }}
          path: tmp/npm-logs/
          retention-days: 7

  jsx-redirection:
    name: JSX redirection-${{ matrix.fixture }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture: [next14, next15, next16]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/${{ matrix.fixture }}/package-lock.json
      - run: npm ci
      - run: npm ci --prefix fixtures/${{ matrix.fixture }}
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run test:jsx-redirection -- ${{ matrix.fixture }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: npm-jsx-redirection-${{ matrix.fixture }}
          path: tmp/npm-logs/
          retention-days: 7

  required:
    name: require all validation jobs
    if: always()
    needs: [contracts, compatibility, sanitizer-browsers, jsx-redirection, playwright-csp]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          JSX_RESULT: ${{ needs.jsx-redirection.result }}
          SANITIZER_RESULT: ${{ needs.sanitizer-browsers.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright-csp.result }}
        run: |
          test "$CONTRACTS_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          test "$SANITIZER_RESULT" = success
          test "$JSX_RESULT" = success
          test "$PLAYWRIGHT_RESULT" = success
